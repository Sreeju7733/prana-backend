openapi: 3.0.3
info:
  title: PRANA Emergency Medical Identity & Intelligent Health Record Platform API
  description: Production REST API specification for the PRANA healthcare platform,
    connecting the Patient Mobile App, Responder Mobile App, Hospital Web Portal,
    and Super Admin Web Portal.
  version: 1.0.0
  contact:
    name: PRANA Development Team - SSMRV College (Dr. Manmohan Singh Bengaluru City
      University)
    email: sreeju.dev@gmail.com
servers:
- url: https://prana-backend.vercel.app
  description: Production Cloudflare / Vercel Edge Server
- url: http://localhost:3000
  description: Local Development Server
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth JWT or Iron-Session bearer token
    AdminSession:
      type: apiKey
      in: cookie
      name: prana_admin_session
      description: Super Admin Iron-Session encrypted cookie
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: string
      required:
      - error
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        prana_id:
          type: string
          example: PID-A74921
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
          format: date
        blood_group:
          type: string
          enum:
          - A+
          - A-
          - B+
          - B-
          - AB+
          - AB-
          - O+
          - O-
        phone:
          type: string
        emergency_medical_notes:
          type: string
        organ_donor:
          type: boolean
    EmergencyAccessResponse:
      type: object
      properties:
        prana_id:
          type: string
        blood_group:
          type: string
        allergies:
          type: array
          items:
            type: object
            properties:
              allergen:
                type: string
              severity:
                type: string
              reaction:
                type: string
        active_medications:
          type: array
          items:
            type: object
            properties:
              medication_name:
                type: string
              dosage:
                type: string
              frequency:
                type: string
        chronic_conditions:
          type: array
          items:
            type: object
            properties:
              condition_name:
                type: string
              status:
                type: string
        emergency_contacts:
          type: array
          items:
            type: object
            properties:
              contact_name:
                type: string
              relationship:
                type: string
              phone_number:
                type: string
              is_primary:
                type: boolean
    AISummaryResponse:
      type: object
      properties:
        record_id:
          type: string
          format: uuid
        document_url:
          type: string
          format: uri
        extracted_summary:
          type: object
          properties:
            diagnosis:
              type: array
              items:
                type: string
            medications_prescribed:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  dosage:
                    type: string
                  duration:
                    type: string
            vitals_extracted:
              type: object
            clinical_warning:
              type: string
paths:
  /api/auth/register:
    post:
      summary: Register new user account
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                password:
                  type: string
                  minLength: 8
                first_name:
                  type: string
                last_name:
                  type: string
              required:
              - email
              - password
              - first_name
      responses:
        '201':
          description: User successfully created
        '400':
          description: Validation failure or user exists
  /api/auth/login:
    post:
      summary: Authenticate user credentials
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
      responses:
        '200':
          description: Authentication successful with JWT and profile metadata
        '401':
          description: Invalid credentials
  /api/user/profile:
    get:
      summary: Fetch current user demographic and emergency profile
      tags:
      - User Profile
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Profile payload returned
          content:
            application/json:
              schema:
                ? ''
                : '#/components/schemas/Profile'
        '401':
          description: Unauthorized
    put:
      summary: Update user demographic and clinical summary fields
      tags:
      - User Profile
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Profile updated successfully
  /api/emergency/public/{prana_id}:
    get:
      summary: Retrieve public emergency first-aid card (Bystander access)
      tags:
      - Emergency Access
      parameters:
      - name: prana_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Public first aid data returned with Red Card UI payload
        '404':
          description: PRANA ID not recognized
  /api/emergency/verify:
    post:
      summary: Verify PRANA-QR cryptographic token and decrypt clinical dossier (Paramedic
        access)
      tags:
      - Emergency Access
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                qr_payload:
                  type: string
                  description: Base45 encoded binary ciphertext
                scanner_location:
                  type: string
                  example: 12.9234, 77.5849
              required:
              - qr_payload
      responses:
        '200':
          description: Cryptographically verified emergency trauma dossier
          content:
            application/json:
              schema:
                ? ''
                : '#/components/schemas/EmergencyAccessResponse'
        '400':
          description: Invalid QR token, corrupted payload, or expired timestamp
        '401':
          description: Unauthorized responder credentials
  /api/ai/summarize:
    post:
      summary: Multimodal AI medical report parsing and summarization using Google
        Gemini 2.0 Flash
      tags:
      - AI Intelligence
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                document_url:
                  type: string
                  format: uri
                mime_type:
                  type: string
                  example: image/jpeg
              required:
              - document_url
      responses:
        '200':
          description: AI medical summary successfully generated
          content:
            application/json:
              schema:
                ? ''
                : '#/components/schemas/AISummaryResponse'
        '500':
          description: Gemini API inference or extraction error
  /api/hospital/patients/search:
    get:
      summary: Search patient records for ER admission and triage desk
      tags:
      - Hospital Portal
      security:
      - BearerAuth: []
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
        description: PRANA ID, phone number, or government health ID
      responses:
        '200':
          description: Patient search results
        '403':
          description: Forbidden - requires verified hospital staff role
  /api/admin/hospitals/{id}/verify:
    put:
      summary: Approve or suspend clinical hospital accreditation
      tags:
      - Super Admin
      security:
      - AdminSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active:
                  type: boolean
                review_notes:
                  type: string
              required:
              - is_active
      responses:
        '200':
          description: Hospital facility status updated successfully
        '403':
          description: Unauthorized - super admin role required
